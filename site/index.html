<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Paper Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Capture sign-in errors returned in the URL before the auth client clears them.
    window.__AUTH_RETURN = (location.hash.replace(/^#/, '') + '&' + location.search.replace(/^\?/, ''));
  </script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <header id="topbar" hidden>
    <a class="brand" href="#/"><span>📚</span> <span id="lab-name">Lab Portal</span></a>
    <nav id="nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/papers" data-nav="papers">Papers</a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/graph" data-nav="graph">Graph</a>
      <a href="#/insights" data-nav="insights">Insights</a>
      <a href="#/tech" data-nav="tech">Tech</a>
      <a href="#/import" data-nav="import">Import</a>
      <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
    </nav>
    <div class="user">
      <span id="user-name"></span>
      <button class="ghost small" id="btn-signout">Sign out</button>
    </div>
  </header>
  <main id="app"><div class="loading">Loading…</div></main>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
