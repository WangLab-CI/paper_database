name: Track technologies

on:
  schedule:
    - cron: '17 5 * * *'      # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check literature, product pages and news feeds
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://svdushruibzmvgcilxux.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Secret SUPABASE_SERVICE_KEY is not set - skipping. See README > Technology tracking."
            exit 0
          fi
          node scripts/track-products.mjs
